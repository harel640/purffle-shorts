# Gitleaks configuration for PurffleShorts.
# Extends the full default ruleset and only allowlists known-safe placeholder files,
# so value-less examples don't produce false positives that would block commits.
# Real secrets anywhere else are still caught. See CLAUDE.md.
title = "PurffleShorts gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Example/placeholder files that hold variable names only, never real values."
paths = [
  '''\.env\.example$''',
]
